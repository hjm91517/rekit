name: ios-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sanity:
    name: 静态自检 (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验工程结构 / plist / YAML / 括号平衡
        run: python3 scripts/check_project.py .

  test:
    name: 单元测试 (simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: 生成工程
        run: xcodegen generate
      - name: xcodebuild test
        run: |
          set -o pipefail
          xcodebuild test \
            -project REKit.xcodeproj \
            -scheme REKitApp \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tail -n 120

  build:
    name: 构建未签名 IPA (device)
    runs-on: macos-14
    needs: sanity
    steps:
      - uses: actions/checkout@v4
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: 生成工程
        run: xcodegen generate
      - name: 编译 arm64 真机包
        run: |
          set -o pipefail
          xcodebuild build \
            -project REKit.xcodeproj \
            -scheme REKitApp \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 80
      - name: 打包 IPA
        run: bash scripts/package_ipa.sh build/Build/Products/Release-iphoneos artifacts
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: REKit-ipa-${{ github.sha }}
          path: |
            artifacts/*.ipa
            artifacts/*.dylib
            artifacts/manifest.txt
          if-no-files-found: error
