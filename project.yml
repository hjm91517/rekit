name: REKit
options:
  bundleIdPrefix: com.chuck
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_BITCODE: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    GCC_C_LANGUAGE_STANDARD: gnu17
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"

targets:
  REKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources/REKit
    dependencies:
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chuck.rekit
        PRODUCT_NAME: REKit
        DEFINES_MODULE: YES
        SKIP_INSTALL: NO
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO

  REKitApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
    dependencies:
      - target: REKit
        embed: true
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chuck.rekitapp
        PRODUCT_NAME: REKitApp
        INFOPLIST_FILE: Config/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_PREVIEWS: NO

  REKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/REKitTests
    dependencies:
      - target: REKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chuck.rekittests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  REKitApp:
    build:
      targets:
        REKitApp: all
        REKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - REKitTests
  REKit:
    build:
      targets:
        REKit: all
